name: Build Standalone Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: AstraCradle-Windows
          - os: macos-latest
            artifact_name: AstraCradle-macOS
          - os: ubuntu-latest
            artifact_name: AstraCradle-Linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Tk dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk

      - name: Install AstraCradle & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build standalone bundle via PyInstaller spec
        run: pyinstaller --noconfirm packaging/astracradle.spec

      - name: Package standalone archive
        shell: python
        run: |
          import shutil, pathlib
          dist_dir = pathlib.Path("dist/AstraCradle")
          if not dist_dir.exists():
              dist_dir = pathlib.Path("dist")
          shutil.make_archive("${{ matrix.artifact_name }}", "zip", dist_dir)

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  publish-release:
    needs: build-standalone
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach standalone ZIPs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
