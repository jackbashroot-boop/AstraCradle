[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astracradle"
version = "2.5.1"
description = "Cross-platform Dyson-Core OS Equilibrium, Hardware Affinity Presets, Optimization Pipelines, Telemetry History & Forensic Self-Healing Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "darkdetect>=0.8.0",
    "pystray>=0.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
build = ["pyinstaller>=6.0.0"]

[project.scripts]
astracradle = "astracradle.__main__:main"
astracradle-wifi = "astracradle.__main__:wifi_entry"

[project.gui-scripts]
astracradle-gui = "astracradle.__main__:main"

[tool.setuptools.packages.find]
include = ["astracradle*"]

[tool.setuptools.package-data]
astracradle = ["assets/*", "_build_info.json"]
