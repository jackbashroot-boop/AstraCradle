name: AstraCradle CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system Tk & Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
      - name: Install AstraCradle & pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run full test suite under Xvfb
        run: xvfb-run -a -s "-screen 0 1920x1080x24" pytest -v tests/
      - name: Compileall & AST shell=True security audit
        run: |
          python -m compileall -q astracradle
          python -c "import ast, pathlib; hits = [str(p) for p in pathlib.Path('astracradle').rglob('*.py') for n in ast.walk(ast.parse(p.read_text())) if isinstance(n, ast.keyword) and n.arg == 'shell' and isinstance(n.value, ast.Constant) and n.value.value is True]; assert not hits, hits"
